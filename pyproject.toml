[project]
name = "financeflow"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.11.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
financeflow = "financeflow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financeflow"]